[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/contracts",
    "crates/config",
    "crates/observability",
    "crates/storage",
    "crates/market-providers",
    "crates/agent-protocol",
    "crates/supervisor-core",
    "crates/api-client",
    "crates/research-engine",
    "apps/agent",
    "apps/management-api",
    "apps/desktop",
    "workers/sample-worker",
    "workers/market-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
dioxus = { version = "=0.7.10", features = ["desktop"] }
futures-util = "=0.3.34"
mongodb = { version = "=3.10.1", default-features = false, features = ["compat-3-0-0", "dns-resolver", "rustls-tls-aws-lc"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt", "io-util", "process", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "=6.0.0", features = ["chrono", "yaml"] }
url = "=2.5.8"
uuid = { version = "=1.29.3", features = ["v4"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }

tm-trading-agent-protocol = { path = "crates/agent-protocol" }
tm-trading-api-client = { path = "crates/api-client" }
tm-trading-config = { path = "crates/config" }
tm-trading-contracts = { path = "crates/contracts" }
tm-trading-domain = { path = "crates/domain" }
tm-trading-market-providers = { path = "crates/market-providers" }
tm-trading-observability = { path = "crates/observability" }
tm-trading-storage = { path = "crates/storage" }
tm-trading-supervisor-core = { path = "crates/supervisor-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
