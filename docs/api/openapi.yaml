openapi: 3.1.0
info:
  title: TM Trading Rust Management API
  description: Read-only market intelligence and service-management API.
  license:
    name: ''
  version: 1.0.0
paths:
  /api/v1/agent/commands/claim:
    post:
      tags:
      - Agent
      operationId: agent_claim_command
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCommandRequest'
        required: true
      responses:
        '200':
          description: Next leased command, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/commands/{operation_id}/complete:
    post:
      tags:
      - Agent
      operationId: agent_complete_command
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteCommandRequest'
        required: true
      responses:
        '200':
          description: Command result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Lease is no longer held by this Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/commands/{operation_id}/progress:
    post:
      tags:
      - Agent
      operationId: agent_progress_command
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressCommandRequest'
        required: true
      responses:
        '200':
          description: Command started executing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Lease is no longer held by this Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/heartbeat:
    post:
      tags:
      - Agent
      operationId: agent_heartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
        required: true
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/ai-providers:
    get:
      tags:
      - AI
      operationId: list_ai_provider_profiles
      responses:
        '200':
          description: AI provider profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderProfileListDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
      - AI
      operationId: create_ai_provider_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAiProviderProfileDto'
        required: true
      responses:
        '200':
          description: Created AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderProfileDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Invalid AI provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/ai-providers/{id}:
    get:
      tags:
      - AI
      operationId: get_ai_provider_profile
      parameters:
      - name: id
        in: path
        description: AI provider profile identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderProfileDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags:
      - AI
      operationId: delete_ai_provider_profile
      parameters:
      - name: id
        in: path
        description: AI provider profile identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AI provider profile deleted
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      tags:
      - AI
      operationId: update_ai_provider_profile
      parameters:
      - name: id
        in: path
        description: AI provider profile identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiProviderProfileDto'
        required: true
      responses:
        '200':
          description: Updated AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderProfileDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Invalid AI provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/ai-providers/{id}/test:
    post:
      tags:
      - AI
      operationId: test_ai_provider_profile
      parameters:
      - name: id
        in: path
        description: AI provider profile identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AI provider health test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderProfileDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown AI provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Current API health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/market/overview:
    get:
      tags:
      - Market
      operationId: market_overview
      parameters:
      - name: symbols
        in: query
        description: Comma-separated symbols; defaults to the caller's default watchlist
        required: false
        schema:
          type: string
      - name: timeframe
        in: query
        description: Closed-candle timeframe, default 1m
        required: false
        schema:
          type: string
      - name: bars
        in: query
        description: Bars per symbol, 1 to 500, default 60
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Closed-candle overview with an explicit empty, partial, or stale state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverviewDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Unsupported timeframe or an out-of-range request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/market/pulse:
    get:
      tags:
      - Market
      operationId: market_pulse
      parameters:
      - name: symbols
        in: query
        description: Comma-separated symbols; defaults to the caller's default watchlist
        required: false
        schema:
          type: string
      - name: timeframe
        in: query
        description: Closed-candle timeframe, default 1m
        required: false
        schema:
          type: string
      - name: bars
        in: query
        description: Bars per symbol, 1 to 500, default 60
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Ranked movers with a change, volume ratio, and volatility summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPulseDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Unsupported timeframe or an out-of-range request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/news:
    get:
      tags:
      - News
      operationId: list_news
      parameters:
      - name: source_id
        in: query
        description: Exact source identifier filter
        required: false
        schema:
          type: string
      - name: market_group
        in: query
        description: Exact market group filter
        required: false
        schema:
          type: string
      - name: level
        in: query
        description: 'Exact editorial level: HIGH, MED, or LOW'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Only items ingested at or after this RFC 3339 instant
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items, 1 to 200, default 50
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Rights-safe normalized stories, newest ingestion first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The requested limit or level is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/news/clusters:
    get:
      tags:
      - News
      operationId: list_news_clusters
      parameters:
      - name: market_group
        in: query
        description: Exact market group filter
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Only clusters whose last observation is at or after this RFC 3339 instant
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of clusters, 1 to 200, default 50
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: News event clusters, newest observation first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsClusterListDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The requested limit is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/news/sources:
    get:
      tags:
      - News
      operationId: list_news_sources
      responses:
        '200':
          description: Configured news sources with their observed health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSourceListDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/news/{news_id}:
    get:
      tags:
      - News
      operationId: get_news_item
      parameters:
      - name: news_id
        in: path
        description: Deterministic news item identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: One rights-safe normalized story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItemDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown or non-displayable news item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/operations/{operation_id}:
    get:
      tags:
      - Operations
      operationId: get_operation
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Durable operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/providers:
    get:
      tags:
      - Providers
      operationId: list_provider_instances
      responses:
        '200':
          description: Configured provider instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderInstanceDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
      - Providers
      operationId: create_provider_instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderInstanceRequest'
        required: true
      responses:
        '201':
          description: Created provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstanceDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Unknown definition or invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/providers/catalog:
    get:
      tags:
      - Providers
      operationId: list_provider_catalog
