openapi: 3.1.0
info:
  title: TM Trading Rust Management API
  description: Read-only market intelligence and service-management API.
  license:
    name: ''
  version: 1.0.0
paths:
  /api/v1/agent/commands/claim:
    post:
      tags:
      - Agent
      operationId: agent_claim_command
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCommandRequest'
        required: true
      responses:
        '200':
          description: Next leased command, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/commands/{operation_id}/complete:
    post:
      tags:
      - Agent
      operationId: agent_complete_command
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteCommandRequest'
        required: true
      responses:
        '200':
          description: Command result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Lease is no longer held by this Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/commands/{operation_id}/progress:
    post:
      tags:
      - Agent
      operationId: agent_progress_command
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressCommandRequest'
        required: true
      responses:
        '200':
          description: Command started executing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressCommandResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Lease is no longer held by this Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/agent/heartbeat:
    post:
      tags:
      - Agent
      operationId: agent_heartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
        required: true
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatResponse'
        '401':
          description: Missing or invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Current API health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/operations/{operation_id}:
    get:
      tags:
      - Operations
      operationId: get_operation
      parameters:
      - name: operation_id
        in: path
        description: Operation identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Durable operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/services:
    get:
      tags:
      - Services
      operationId: list_services
      responses:
        '200':
          description: Known service instances and their last reported state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSnapshot'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/services/{service_instance_id}:
    get:
      tags:
      - Services
      operationId: get_service
      parameters:
      - name: service_instance_id
        in: path
        description: Service instance identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Service instance state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSnapshot'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/services/{service_instance_id}/operations:
    post:
      tags:
      - Operations
      operationId: create_service_operation
      parameters:
      - name: service_instance_id
        in: path
        description: Service instance identifier
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Caller supplied idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationRequest'
        required: true
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Request does not match the target service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/version:
    get:
      tags:
      - System
      operationId: version
      responses:
        '200':
          description: API and service versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionInfo'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/watchlists:
    get:
      tags:
      - Watchlists
      operationId: list_watchlists
      responses:
        '200':
          description: Watchlists owned by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
      - Watchlists
      operationId: create_watchlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchlistRequest'
        required: true
      responses:
        '201':
          description: Created watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The owner already has a list with this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The watchlist failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/watchlists/{watchlist_id}:
    delete:
      tags:
      - Watchlists
      operationId: delete_watchlist
      parameters:
      - name: watchlist_id
        in: path
        description: Watchlist identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Watchlist deleted
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/watchlists/{watchlist_id}/symbols:
    put:
      tags:
      - Watchlists
      operationId: replace_watchlist_symbols
      parameters:
      - name: watchlist_id
        in: path
        description: Watchlist identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWatchlistSymbolsRequest'
        required: true
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The symbol set failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    AgentCommandDto:
      type: object
      description: A single leased command addressed to an Agent.
      required:
      - operation_id
      - service_instance_id
      - service_definition_id
      - action
      - fencing_token
      - lease_expires_at
      - expires_at
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        expires_at:
          type: string
          format: date-time
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        lease_expires_at:
          type: string
          format: date-time
        operation_id:
          type: string
        service_definition_id:
          type: string
        service_instance_id:
          type: string
    AgentHeartbeatRequest:
      type: object
      description: Agent heartbeat carrying the current service read model.
      required:
      - agent_id
      - agent_version
      - host_os
      - host_architecture
      - services
      properties:
        agent_id:
          type: string
        agent_version:
          type: string
        host_architecture:
          type: string
        host_os:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSnapshot'
    AgentHeartbeatResponse:
      type: object
      description: Response to an Agent heartbeat.
      required:
      - accepted
      - server_time
      properties:
        accepted:
          type: boolean
        server_time:
          type: string
          format: date-time
    ApiErrorBody:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        correlation_id:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        message:
          type: string
    ApiErrorCode:
      type: string
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - too_many_requests
      - internal
      - service_unavailable
    ApiErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorBody'
    ApiVersionInfo:
      type: object
      required:
      - api_version
      - contract_version
      - service_version
      properties:
        api_version:
          type: string
        contract_version:
          type: string
        service_version:
          type: string
    ClaimCommandRequest:
      type: object
      description: Request to claim the next command addressed to an Agent.
      required:
      - agent_id
      properties:
        agent_id:
          type: string
    ClaimCommandResponse:
      type: object
      description: Response to a command claim.
      properties:
        command:
          oneOf:
          - $ref: '#/components/schemas/AgentCommandDto'
          - type: 'null'
    CompleteCommandRequest:
      type: object
      description: Agent report of the outcome of a claimed command.
      required:
      - operation_id
      - agent_id
      - fencing_token
      - succeeded
      properties:
        agent_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        operation_id:
          type: string
        redacted_error:
          type:
          - string
          - 'null'
        result_summary:
          type:
          - string
          - 'null'
        succeeded:
          type: boolean
    CompleteCommandResponse:
      type: object
      description: Response to a command completion report.
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    CreateOperationRequest:
      type: object
      required:
      - service_instance_id
      - action
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        service_instance_id:
          type: string
    CreateWatchlistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        symbols:
          type: array
          items:
            type: string
    DesiredStateDto:
      type: string
      description: Canonical desired state of a service instance.
      enum:
      - RUNNING
      - STOPPED
    HealthResponse:
      type: object
      required:
      - status
      - version
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        version:
          $ref: '#/components/schemas/ApiVersionInfo'
    HealthStatus:
      type: string
      enum:
      - healthy
      - degraded
      - unhealthy
    ObservedStateDto:
      type: string
      description: Canonical observed state of a service instance.
      enum:
      - STARTING
      - RUNNING
      - STOPPING
      - STOPPED
      - FAILED
      - UNKNOWN
    OperationActionDto:
      type: string
      enum:
      - start
      - stop
      - restart
    OperationResponse:
      type: object
      required:
      - operation_id
      - schema_version
      - idempotency_key
      - correlation_id
      - service_instance_id
      - service_definition_id
      - target_agent_id
      - action
      - status
      - attempt
      - fencing_token
      - requested_by
      - requested_at
      - expires_at
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        attempt:
          type: integer
          format: int32
          minimum: 0
        correlation_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        idempotency_key:
          type: string
        lease_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        operation_id:
          type: string
        redacted_error:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        requested_by:
          type: string
        result_summary:
          type:
          - string
          - 'null'
        schema_version:
          type: integer
          format: int32
          minimum: 0
        service_definition_id:
          type: string
        service_instance_id:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/OperationStatusDto'
        target_agent_id:
          type: string
    OperationStatusDto:
      type: string
      enum:
      - accepted
      - queued
      - claimed
      - running
      - succeeded
      - failed
      - cancelled
      - expired
    ProgressCommandRequest:
      type: object
      description: Agent report that a claimed command has started executing.
      required:
      - operation_id
      - agent_id
      - fencing_token
      properties:
        agent_id:
          type: string
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        operation_id:
          type: string
    ProgressCommandResponse:
      type: object
      description: Response to a command progress report.
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    ReadinessDto:
      type: string
      description: Canonical readiness of a service instance.
      enum:
      - READY
      - DEGRADED
      - NOT_READY
      - UNKNOWN
    ReplaceWatchlistSymbolsRequest:
      type: object
      required:
      - symbols
      properties:
        symbols:
          type: array
          items:
            type: string
    ServiceSnapshot:
      type: object
      description: Read model of one service instance as reported by its owning Agent.
      required:
      - service_instance_id
      - service_definition_id
      - agent_id
      - desired_state
      - observed_state
      - readiness
      - restart_count
      - retry_blocked
      - updated_at
      properties:
        agent_id:
          type: string
        desired_state:
          $ref: '#/components/schemas/DesiredStateDto'
        last_exit_code:
          type:
          - integer
          - 'null'
          format: int32
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        observed_state:
          $ref: '#/components/schemas/ObservedStateDto'
        process_alive:
          type:
          - boolean
          - 'null'
        readiness:
          $ref: '#/components/schemas/ReadinessDto'
        restart_count:
          type: integer
          format: int32
          minimum: 0
        retry_blocked:
          type: boolean
        service_definition_id:
          type: string
        service_instance_id:
          type: string
        updated_at:
          type: string
          format: date-time
    WatchlistDto:
      type: object
      description: A named symbol list owned by the authenticated subject.
      required:
      - id
      - name
      - symbols
      - is_default
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
        is_default:
          type: boolean
        name:
          type: string
        symbols:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
tags:
- name: System
  description: Version and health endpoints
- name: Services
  description: Service read model
- name: Operations
  description: Durable asynchronous service operations
- name: Watchlists
  description: Owner-scoped symbol lists
- name: Agent
  description: Agent-only heartbeat and command endpoints
