  /api/v1/providers/{provider_instance_id}:
    get:
      tags:
      - Providers
      operationId: get_provider_instance
      parameters:
      - name: provider_instance_id
        in: path
        description: Provider instance identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Configured provider instance
          content:
            application/json:
