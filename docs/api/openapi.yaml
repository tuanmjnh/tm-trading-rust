        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    AgentCommandDto:
      type: object
      description: A single leased command addressed to an Agent.
      required:
      - operation_id
      - service_instance_id
      - service_definition_id
      - action
      - fencing_token
      - lease_expires_at
      - expires_at
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        expires_at:
          type: string
          format: date-time
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        lease_expires_at:
          type: string
          format: date-time
        operation_id:
          type: string
        service_definition_id:
          type: string
        service_instance_id:
          type: string
    AgentHeartbeatRequest:
      type: object
      description: Agent heartbeat carrying the current service read model.
      required:
      - agent_id
      - agent_version
      - host_os
      - host_architecture
      - services
      properties:
        agent_id:
          type: string
        agent_version:
          type: string
        host_architecture:
          type: string
        host_os:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSnapshot'
    AgentHeartbeatResponse:
      type: object
      description: Response to an Agent heartbeat.
      required:
      - accepted
      - server_time
      properties:
        accepted:
          type: boolean
        server_time:
          type: string
          format: date-time
    AiProviderProfileDto:
      type: object
      required:
      - id
      - kind
      - display_name
      - enabled
      - base_url
      - default_model
      - timeout_ms
      - api_key_env
      - health_state
      - created_at
      - updated_at
      properties:
        api_key_env:
          type: string
        base_url:
          type: string
        created_at:
          type: string
          format: date-time
        default_model:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
        health_state:
          type: string
        id:
          type: string
        kind:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_health_check_at:
          type:
          - string
          - 'null'
          format: date-time
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    AiProviderProfileListDto:
      type: object
      required:
      - generated_at
      - count
      - profiles
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AiProviderProfileDto'
    ApiErrorBody:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        correlation_id:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        message:
          type: string
    ApiErrorCode:
      type: string
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - too_many_requests
      - internal
      - service_unavailable
    ApiErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorBody'
    ApiVersionInfo:
      type: object
      required:
      - api_version
      - contract_version
      - service_version
      properties:
        api_version:
          type: string
        contract_version:
          type: string
        service_version:
          type: string
    ClaimCommandRequest:
      type: object
      description: Request to claim the next command addressed to an Agent.
      required:
      - agent_id
      properties:
        agent_id:
          type: string
    ClaimCommandResponse:
      type: object
      description: Response to a command claim.
      properties:
        command:
          oneOf:
          - $ref: '#/components/schemas/AgentCommandDto'
          - type: 'null'
    CompleteCommandRequest:
      type: object
      description: Agent report of the outcome of a claimed command.
      required:
      - operation_id
      - agent_id
      - fencing_token
      - succeeded
      properties:
        agent_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        operation_id:
          type: string
        redacted_error:
          type:
          - string
          - 'null'
        result_summary:
          type:
          - string
          - 'null'
        succeeded:
          type: boolean
    CompleteCommandResponse:
      type: object
      description: Response to a command completion report.
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    CreateOperationRequest:
      type: object
      required:
      - service_instance_id
      - action
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        service_instance_id:
          type: string
    CreateProviderInstanceRequest:
      type: object
      required:
      - provider_definition_id
      - display_name
      properties:
        base_url:
          type:
          - string
          - 'null'
          description: Defaults to the definition's public base URL when omitted.
        display_name:
          type: string
        provider_definition_id:
          type: string
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Defaults to the service's probe timeout when omitted.
          minimum: 0
    CreateWatchlistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        symbols:
          type: array
          items:
            type: string
    DesiredStateDto:
      type: string
      description: Canonical desired state of a service instance.
      enum:
      - RUNNING
      - STOPPED
    HealthResponse:
      type: object
      required:
      - status
      - version
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        version:
          $ref: '#/components/schemas/ApiVersionInfo'
    HealthStatus:
      type: string
      enum:
      - healthy
      - degraded
      - unhealthy
    MarketMoverDto:
      type: object
      description: One symbol ranked by movement.
      required:
      - symbol
      - state
      - candle_count
      properties:
        candle_count:
          type: integer
          minimum: 0
        change_percent:
          type:
          - number
          - 'null'
          format: double
        last_close:
          type:
          - number
          - 'null'
          format: double
        state:
          $ref: '#/components/schemas/MarketStateDto'
        symbol:
          type: string
        volatility_percent:
          type:
          - number
          - 'null'
          format: double
        volume_ratio:
          type:
          - number
          - 'null'
          format: double
    MarketOverviewDto:
      type: object
      description: Closed-candle overview for a bounded set of symbols.
      required:
      - generated_at
      - timeframe
      - state
      - stale_after_seconds
      - symbols
      properties:
        generated_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/MarketStateDto'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/MarketSymbolDto'
        timeframe:
          type: string
    MarketPulseDto:
      type: object
      description: Ranked movers and activity for the same bounded symbol set.
      required:
      - generated_at
      - timeframe
      - state
      - stale_after_seconds
      - movers
      properties:
        generated_at:
          type: string
          format: date-time
        movers:
          type: array
          items:
            $ref: '#/components/schemas/MarketMoverDto'
        stale_after_seconds:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/MarketStateDto'
        timeframe:
          type: string
    MarketStateDto:
      type: string
      description: |-
        Read-model state of one market panel or one symbol inside it.

        The states are explicit so a caller can tell "no data yet" from "data exists but is
        old" without inferring it from empty arrays or timestamps.
      enum:
      - OK
      - PARTIAL
      - STALE
      - EMPTY
    MarketSymbolDto:
      type: object
      description: One symbol's closed-candle summary.
      required:
      - symbol
      - state
      - candle_count
      properties:
        candle_count:
          type: integer
          minimum: 0
        change_percent:
          type:
          - number
          - 'null'
          format: double
        data_age_seconds:
          type:
          - integer
          - 'null'
          format: int64
        high:
          type:
          - number
          - 'null'
          format: double
        last_close:
          type:
          - number
          - 'null'
          format: double
        last_close_time:
          type:
          - string
          - 'null'
          format: date-time
        last_open_time:
          type:
          - string
          - 'null'
          format: date-time
        low:
          type:
          - number
          - 'null'
          format: double
        state:
          $ref: '#/components/schemas/MarketStateDto'
        symbol:
          type: string
        volume:
          type:
          - number
          - 'null'
          format: double
    NewAiProviderProfileDto:
      type: object
      required:
      - id
      - kind
      - display_name
      - base_url
      - default_model
      - timeout_ms
      - api_key_env
      properties:
        api_key_env:
          type: string
        base_url:
          type: string
        default_model:
          type: string
        display_name:
          type: string
        id:
          type: string
        kind:
          type: string
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
    NewsClusterDto:
      type: object
      description: One cluster of stories that describe the same event.
      required:
      - id
      - item_ids
      - item_count
      - tokens
      - market_group
      - first_seen_at
      - last_seen_at
      properties:
        first_seen_at:
          type: string
          format: date-time
        id:
          type: string
        item_count:
          type: integer
          minimum: 0
        item_ids:
          type: array
          items:
            type: string
        last_seen_at:
          type: string
          format: date-time
        market_group:
          type: string
        tokens:
          type: array
          items:
            type: string
    NewsClusterListDto:
      type: object
      description: A bounded list of news event clusters.
      required:
      - generated_at
      - count
      - clusters
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/NewsClusterDto'
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
    NewsClusterQueryDto:
      type: object
      description: Optional filters for a news cluster list request.
      properties:
        limit:
          type:
          - integer
          - 'null'
          description: Maximum number of clusters to return.
          minimum: 0
        market_group:
          type:
          - string
          - 'null'
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: Only clusters whose last observation is at or after this instant.
    NewsDirectionDto:
      type: string
      description: Direction the story is read as having for the market.
      enum:
      - POS
      - NEG
      - FLAT
    NewsFreshnessDto:
      type: string
      description: |-
        Whether a story is recent enough for a live desk.

        Freshness is computed when the story is read, because it depends on the
        current time rather than on the moment the story was written.
      enum:
      - FRESH
      - STALE
    NewsHealthStateDto:
      type: string
      description: Observed health of one news source.
      enum:
      - OK
      - DEGRADED
      - DOWN
      - UNKNOWN
    NewsItemDto:
      type: object
      description: One rights-safe normalized story.
      required:
      - id
      - source_id
      - url
      - title
      - excerpt
      - language
      - first_seen_at
      - ingested_at
      - market_group
      - tags
      - level
      - direction
      - score
      - freshness
      - age_seconds
      properties:
        age_seconds:
          type: integer
          format: int64
        direction:
          $ref: '#/components/schemas/NewsDirectionDto'
        event_type:
          type:
          - string
          - 'null'
        excerpt:
          type: string
        first_seen_at:
          type: string
          format: date-time
        freshness:
          $ref: '#/components/schemas/NewsFreshnessDto'
        id:
          type: string
        ingested_at:
          type: string
          format: date-time
        language:
          type: string
        level:
          $ref: '#/components/schemas/NewsLevelDto'
        market_group:
          type: string
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Provider publication time; absent when the feed carries no usable date.
        score:
          type: number
          format: double
        source_id:
          type: string
        tags:
          type: array
          items:
            type: string
        title:
          type: string
        url:
          type: string
          description: Citation link exactly as the publisher exposed it.
    NewsLevelDto:
      type: string
      description: Editorial significance of one story.
      enum:
      - HIGH
      - MED
      - LOW
    NewsListDto:
      type: object
      description: A bounded list of normalized stories.
      required:
      - generated_at
      - count
      - stale_after_seconds
      - items
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItemDto'
        stale_after_seconds:
          type: integer
          format: int64
          description: Age after which a story is reported as stale.
    NewsQueryDto:
      type: object
      description: Optional filters for a news list request.
      properties:
        level:
          oneOf:
          - $ref: '#/components/schemas/NewsLevelDto'
          - type: 'null'
        limit:
          type:
          - integer
          - 'null'
          description: Maximum number of items to return.
          minimum: 0
        market_group:
          type:
          - string
          - 'null'
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: Only items ingested at or after this instant.
        source_id:
          type:
          - string
          - 'null'
    NewsSourceDto:
      type: object
      description: One configured news source and the health it last reported.
      required:
      - id
      - name
      - transport
      - trust_tier
      - enabled
      - market_groups
      - languages
      - poll_interval_sec
      - retention_days
      - health_state
      - consecutive_errors
      properties:
        consecutive_errors:
          type: integer
          format: int32
          minimum: 0
        enabled:
          type: boolean
        feed_url:
          type:
          - string
          - 'null'
          description: Public feed endpoint; `null` when the source has no safe feed URL.
        health_state:
          $ref: '#/components/schemas/NewsHealthStateDto'
        id:
          type: string
        languages:
          type: array
          items:
            type: string
        last_error:
          type:
          - string
          - 'null'
          description: Bounded diagnostic code; raw provider text is never returned.
        last_fetch_at:
          type:
          - string
          - 'null'
          format: date-time
        last_item_at:
          type:
          - string
          - 'null'
          format: date-time
        last_ok_at:
          type:
          - string
          - 'null'
          format: date-time
        market_groups:
          type: array
          items:
            type: string
        name:
          type: string
        poll_interval_sec:
          type: integer
          format: int32
          minimum: 0
        provider:
          type:
          - string
          - 'null'
        retention_days:
          type: integer
          format: int32
          minimum: 0
        transport:
          type: string
        trust_tier:
          type: string
    NewsSourceListDto:
      type: object
      description: The configured news source registry.
      required:
      - generated_at
      - count
      - sources
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/NewsSourceDto'
    ObservedStateDto:
      type: string
      description: Canonical observed state of a service instance.
      enum:
      - STARTING
      - RUNNING
      - STOPPING
      - STOPPED
      - FAILED
      - UNKNOWN
    OperationActionDto:
      type: string
      enum:
      - start
      - stop
      - restart
    OperationResponse:
      type: object
      required:
      - operation_id
      - schema_version
      - idempotency_key
      - correlation_id
      - service_instance_id
      - service_definition_id
      - target_agent_id
      - action
      - status
      - attempt
      - fencing_token
      - requested_by
      - requested_at
      - expires_at
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        attempt:
          type: integer
          format: int32
          minimum: 0
        correlation_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        idempotency_key:
          type: string
        lease_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        operation_id:
          type: string
        redacted_error:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        requested_by:
          type: string
        result_summary:
          type:
          - string
          - 'null'
        schema_version:
          type: integer
          format: int32
          minimum: 0
        service_definition_id:
          type: string
        service_instance_id:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/OperationStatusDto'
        target_agent_id:
          type: string
    OperationStatusDto:
      type: string
      enum:
      - accepted
      - queued
      - claimed
      - running
      - succeeded
      - failed
      - cancelled
      - expired
    ProgressCommandRequest:
      type: object
      description: Agent report that a claimed command has started executing.
      required:
      - operation_id
      - agent_id
      - fencing_token
      properties:
        agent_id:
          type: string
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        operation_id:
          type: string
    ProgressCommandResponse:
      type: object
      description: Response to a command progress report.
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    ProviderDefinitionDto:
      type: object
      description: One adapter compiled into the running service.
      required:
      - id
      - display_name
      - default_base_url
      - timeframes
      properties:
        default_base_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        timeframes:
          type: array
          items:
            type: string
    ProviderHealthStateDto:
      type: string
      description: Last recorded health of a configured provider instance.
      enum:
      - UNKNOWN
      - HEALTHY
      - UNHEALTHY
    ProviderInstanceDto:
      type: object
      description: A configured instance of a provider definition.
      required:
      - id
      - provider_definition_id
      - display_name
      - enabled
      - base_url
      - timeout_ms
      - health_state
      - created_at
      - updated_at
      properties:
        base_url:
          type: string
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        enabled:
          type: boolean
        health_state:
          $ref: '#/components/schemas/ProviderHealthStateDto'
        id:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_health_check_at:
          type:
          - string
          - 'null'
          format: date-time
        last_latency_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        provider_definition_id:
          type: string
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    ReadinessDto:
      type: string
      description: Canonical readiness of a service instance.
      enum:
      - READY
      - DEGRADED
      - NOT_READY
      - UNKNOWN
    ReplaceWatchlistSymbolsRequest:
      type: object
      required:
      - symbols
      properties:
        symbols:
          type: array
          items:
            type: string
    ResearchEventDto:
      type: object
      description: One research observation with its provenance.
      required:
      - id
      - owner_scope
      - symbol
      - timeframe
      - event_type
      - method
      - method_version
      - direction
      - score
      - observed_at
      - detected_at
      - ingested_at
      - source_id
      - provider_method
      - input_snapshot_id
      - producer_version
      - schema_version
      - quality_state
      - quality_reasons
      - freshness
      - age_seconds
      - evidence
      - context
      properties:
        age_seconds:
          type: integer
          format: int64
        context:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        detected_at:
          type: string
          format: date-time
        direction:
          type: integer
          format: int32
          description: '`-1` for a bearish observation, `1` for a bullish one, `0` for neutral.'
        event_type:
          type: string
        evidence:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        freshness:
          $ref: '#/components/schemas/ResearchFreshnessDto'
        id:
          type: string
        ingested_at:
          type: string
          format: date-time
        input_snapshot_id:
          type: string
        method:
          type: string
        method_version:
          type: string
        observed_at:
          type: string
          format: date-time
        owner_scope:
          type: string
        producer_version:
          type: string
        provider_method:
          type: string
        quality_reasons:
          type: array
          items:
            type: string
        quality_state:
          $ref: '#/components/schemas/ResearchQualityDto'
        schema_version:
          type: string
        score:
          type: number
          format: double
        source_id:
          type: string
        symbol:
          type: string
        timeframe:
          type: string
    ResearchEventListDto:
      type: object
      description: A bounded list of research observations.
      required:
      - generated_at
      - count
      - events
      properties:
        count:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/ResearchEventDto'
        generated_at:
          type: string
          format: date-time
    ResearchEventQueryDto:
      type: object
      description: |-
        Optional filters for a research event list request.

        The owner scope is never accepted from the client: the API always derives it
        from the authenticated subject.
      properties:
        event_type:
          type:
          - string
          - 'null'
        limit:
          type:
          - integer
          - 'null'
          description: Maximum number of events to return.
          minimum: 0
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: Only events detected at or after this instant.
        symbol:
          type:
          - string
          - 'null'
        timeframe:
          type:
          - string
          - 'null'
    ResearchFreshnessDto:
      type: string
      description: |-
        Whether an observation is still current.

        Freshness is computed when the event is read, because it depends on the
        current time, not on the moment the event was written.
      enum:
      - FRESH
      - STALE
    ResearchQualityDto:
      type: string
      description: How complete the input of a research event was.
      enum:
      - COMPLETE
      - PARTIAL
      - UNKNOWN
    ServiceSnapshot:
      type: object
      description: Read model of one service instance as reported by its owning Agent.
      required:
      - service_instance_id
      - service_definition_id
      - agent_id
      - desired_state
      - observed_state
      - readiness
      - restart_count
      - retry_blocked
      - updated_at
      properties:
        agent_id:
          type: string
        desired_state:
          $ref: '#/components/schemas/DesiredStateDto'
        last_exit_code:
          type:
          - integer
          - 'null'
          format: int32
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        observed_state:
          $ref: '#/components/schemas/ObservedStateDto'
        process_alive:
          type:
          - boolean
          - 'null'
        readiness:
          $ref: '#/components/schemas/ReadinessDto'
        restart_count:
          type: integer
          format: int32
          minimum: 0
        retry_blocked:
          type: boolean
        service_definition_id:
          type: string
        service_instance_id:
          type: string
        updated_at:
          type: string
          format: date-time
    UpdateAiProviderProfileDto:
      type: object
      properties:
        api_key_env:
          type:
          - string
          - 'null'
        base_url:
          type:
          - string
          - 'null'
        default_model:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    UpdateProviderInstanceRequest:
      type: object
      description: Fields left out are unchanged.
      properties:
        base_url:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    WatchlistDto:
      type: object
      description: A named symbol list owned by the authenticated subject.
      required:
      - id
      - name
      - symbols
      - is_default
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
        is_default:
          type: boolean
        name:
          type: string
        symbols:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
tags:
- name: System
  description: Version and health endpoints
- name: Services
  description: Service read model
- name: Operations
  description: Durable asynchronous service operations
- name: Watchlists
  description: Owner-scoped symbol lists
- name: Providers
  description: Provider catalog and configured instances
- name: Market
  description: Closed-candle market overview and pulse
- name: Research
  description: Owner-scoped deterministic research observations
- name: News
  description: Rights-safe normalized news items and their source registry
- name: Agent
  description: Agent-only heartbeat and command endpoints
