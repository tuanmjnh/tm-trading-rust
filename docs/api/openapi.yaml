          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      tags:
      - Providers
      operationId: update_provider_instance
      parameters:
      - name: provider_instance_id
        in: path
        description: Provider instance identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderInstanceRequest'
        required: true
      responses:
        '200':
          description: Updated provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstanceDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/providers/{provider_instance_id}/test:
    post:
      tags:
      - Providers
      operationId: test_provider_instance
      parameters:
      - name: provider_instance_id
        in: path
        description: Provider instance identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bounded health probe recorded on the instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstanceDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
