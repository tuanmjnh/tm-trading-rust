            type: string
        detected_at:
          type: string
          format: date-time
        direction:
          type: integer
          format: int32
          description: '`-1` for a bearish observation, `1` for a bullish one, `0` for neutral.'
        event_type:
          type: string
        evidence:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        freshness:
          $ref: '#/components/schemas/ResearchFreshnessDto'
        id:
          type: string
        ingested_at:
          type: string
          format: date-time
        input_snapshot_id:
          type: string
        method:
          type: string
        method_version:
          type: string
        observed_at:
          type: string
          format: date-time
        owner_scope:
          type: string
        producer_version:
          type: string
        provider_method:
          type: string
        quality_reasons:
          type: array
          items:
            type: string
        quality_state:
          $ref: '#/components/schemas/ResearchQualityDto'
        schema_version:
          type: string
        score:
          type: number
          format: double
        source_id:
          type: string
        symbol:
          type: string
        timeframe:
          type: string
    ResearchEventListDto:
      type: object
      description: A bounded list of research observations.
      required:
      - generated_at
      - count
      - events
      properties:
        count:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/ResearchEventDto'
        generated_at:
          type: string
          format: date-time
    ResearchEventQueryDto:
      type: object
      description: |-
        Optional filters for a research event list request.

        The owner scope is never accepted from the client: the API always derives it
        from the authenticated subject.
      properties:
        event_type:
          type:
          - string
          - 'null'
        limit:
          type:
          - integer
          - 'null'
          description: Maximum number of events to return.
          minimum: 0
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: Only events detected at or after this instant.
        symbol:
          type:
          - string
          - 'null'
        timeframe:
          type:
          - string
          - 'null'
    ResearchFreshnessDto:
      type: string
      description: |-
        Whether an observation is still current.

        Freshness is computed when the event is read, because it depends on the
        current time, not on the moment the event was written.
      enum:
      - FRESH
      - STALE
    ResearchQualityDto:
      type: string
      description: How complete the input of a research event was.
      enum:
      - COMPLETE
      - PARTIAL
      - UNKNOWN
    SendTestNotificationRequest:
      type: object
      description: Request to send a test notification.
      properties:
        chat_id:
          type:
          - string
          - 'null'
          description: Optional target chat ID override. If omitted, uses the configured default chat ID.
        message:
          type:
          - string
          - 'null'
          description: Optional custom text to send. If omitted, uses a standard verification test message.
      additionalProperties: false
    SendTestNotificationResponse:
      type: object
      description: Response from sending a test notification.
      required:
      - ok
      - accepted
      - sent_at
      properties:
        accepted:
          type: boolean
        error:
          type:
          - string
          - 'null'
        message_id:
          type:
          - string
          - 'null'
        ok:
          type: boolean
        sent_at:
          type: string
          format: date-time
    ServiceSnapshot:
      type: object
      description: Read model of one service instance as reported by its owning Agent.
      required:
      - service_instance_id
      - service_definition_id
      - agent_id
      - desired_state
      - observed_state
      - readiness
      - restart_count
      - retry_blocked
      - updated_at
      properties:
        agent_id:
          type: string
        desired_state:
          $ref: '#/components/schemas/DesiredStateDto'
        last_exit_code:
          type:
          - integer
          - 'null'
          format: int32
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
        observed_state:
          $ref: '#/components/schemas/ObservedStateDto'
        process_alive:
          type:
          - boolean
          - 'null'
        readiness:
          $ref: '#/components/schemas/ReadinessDto'
        restart_count:
          type: integer
          format: int32
          minimum: 0
        retry_blocked:
          type: boolean
        service_definition_id:
          type: string
        service_instance_id:
          type: string
        updated_at:
          type: string
          format: date-time
    StorageDiagnosticsDto:
      type: object
      description: High-level diagnostic snapshot of backend storage.
      required:
