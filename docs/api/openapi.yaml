          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The watchlist failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/watchlists/{watchlist_id}:
    delete:
      tags:
      - Watchlists
      operationId: delete_watchlist
      parameters:
      - name: watchlist_id
        in: path
        description: Watchlist identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Watchlist deleted
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/watchlists/{watchlist_id}/symbols:
    put:
      tags:
      - Watchlists
      operationId: replace_watchlist_symbols
      parameters:
      - name: watchlist_id
        in: path
        description: Watchlist identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWatchlistSymbolsRequest'
        required: true
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The symbol set failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    AgentCommandDto:
      type: object
      description: A single leased command addressed to an Agent.
      required:
      - operation_id
      - service_instance_id
      - service_definition_id
      - action
      - fencing_token
      - lease_expires_at
      - expires_at
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        expires_at:
          type: string
          format: date-time
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        lease_expires_at:
          type: string
          format: date-time
        operation_id:
          type: string
        service_definition_id:
          type: string
        service_instance_id:
          type: string
    AgentHeartbeatRequest:
      type: object
      description: Agent heartbeat carrying the current service read model.
      required:
      - agent_id
      - agent_version
      - host_os
      - host_architecture
      - services
      properties:
        agent_id:
          type: string
        agent_version:
          type: string
        host_architecture:
          type: string
        host_os:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSnapshot'
    AgentHeartbeatResponse:
      type: object
      description: Response to an Agent heartbeat.
      required:
      - accepted
      - server_time
      properties:
        accepted:
          type: boolean
        server_time:
          type: string
          format: date-time
    AiBriefingDto:
      type: object
      description: One evidence-bound AI briefing.
      required:
      - id
      - owner_scope
      - task
      - provider_id
      - model_registry_id
      - model_id
      - prompt_version
      - facts
      - interpretations
      - uncertainties
      - input_snapshot_ids
      - references
      - missing_inputs
      - stale_inputs
      - generated_at
      - producer_version
      - schema_version
      properties:
        facts:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
        id:
          type: string
        input_snapshot_ids:
          type: array
          items:
            type: string
        interpretations:
          type: array
          items:
            type: string
        missing_inputs:
          type: array
          items:
            type: string
        model_id:
          type: string
        model_registry_id:
          type: string
        owner_scope:
          type: string
        producer_version:
          type: string
        prompt_version:
          type: string
        provider_id:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/AiBriefingReferenceDto'
        schema_version:
          type: string
        stale_inputs:
          type: array
          items:
            type: string
        task:
          $ref: '#/components/schemas/AiBriefingTaskDto'
        uncertainties:
          type: array
          items:
            type: string
    AiBriefingListDto:
      type: object
      description: A bounded list of owner-scoped briefings.
      required:
      - generated_at
      - count
      - briefings
      properties:
        briefings:
          type: array
          items:
            $ref: '#/components/schemas/AiBriefingDto'
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
    AiBriefingQueryDto:
      type: object
      description: Optional filters for a briefing list request.
      properties:
        limit:
          type:
          - integer
          - 'null'
          maximum: 200
          minimum: 1
        task:
          oneOf:
          - $ref: '#/components/schemas/AiBriefingTaskDto'
          - type: 'null'
    AiBriefingReferenceDto:
      type: object
      description: One exact source reference cited by a briefing.
      required:
      - kind
      - value
      properties:
        kind:
          $ref: '#/components/schemas/AiBriefingReferenceKindDto'
        value:
          type: string
    AiBriefingReferenceKindDto:
      type: string
      description: Kind of source cited by a briefing.
      enum:
      - research_event
      - news_item
      - source_url
    AiBriefingTaskDto:
      type: string
      description: Task that produced an AI briefing.
      enum:
      - news_classification
      - news_summary
      - market_briefing
      - research_explanation
      - daily_digest
    AiJobDto:
      type: object
      description: One owner-scoped AI job.
      required:
      - id
      - owner_scope
      - correlation_id
      - task
      - status
      - attempt
      - research_event_ids
      - news_item_ids
      - requested_at
      - expires_at
      properties:
        attempt:
          type: integer
          format: int32
          minimum: 0
        briefing_id:
          type:
          - string
          - 'null'
        correlation_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
        news_item_ids:
          type: array
          items:
            type: string
        owner_scope:
          type: string
        requested_at:
          type: string
          format: date-time
        research_event_ids:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AiJobStatusDto'
        task:
          $ref: '#/components/schemas/AiJobTaskDto'
    AiJobListDto:
      type: object
      description: A bounded list of owner-scoped AI jobs.
      required:
      - generated_at
      - count
      - jobs
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/AiJobDto'
    AiJobQueryDto:
      type: object
      description: Optional filters for an AI job list request.
      properties:
        limit:
          type:
          - integer
          - 'null'
          maximum: 200
          minimum: 1
        task:
          oneOf:
          - $ref: '#/components/schemas/AiJobTaskDto'
          - type: 'null'
    AiJobStatusDto:
      type: string
      description: Durable state of one queued AI job.
      enum:
      - QUEUED
      - CLAIMED
      - SUCCEEDED
      - FAILED
      - EXPIRED
      - OUTCOME_UNKNOWN
    AiJobTaskDto:
      type: string
      description: |-
        Task a queued AI job will run.

        The queue currently exposes only the research-explanation task. Other AI task
        kinds remain domain concepts for their dedicated providers and briefings.
      enum:
      - research_explanation
    AiModelDto:
      type: object
      required:
      - id
      - provider_id
      - model_id
      - display_name
      - supports_streaming
      - supports_json_mode
      - supports_tools
      - supports_vision
      - enabled
      - health_state
      - created_at
      - updated_at
      properties:
        context_window:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        enabled:
          type: boolean
        health_state:
          type: string
        id:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_health_check_at:
          type:
          - string
          - 'null'
          format: date-time
        max_output_tokens:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        model_id:
          type: string
        provider_id:
          type: string
        supports_json_mode:
          type: boolean
        supports_streaming:
          type: boolean
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
        updated_at:
          type: string
          format: date-time
    AiModelListDto:
      type: object
      required:
      - generated_at
      - count
      - models
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModelDto'
    AiProviderProfileDto:
      type: object
      required:
      - id
      - kind
      - display_name
      - enabled
      - base_url
      - default_model
      - timeout_ms
      - api_key_env
      - health_state
      - created_at
      - updated_at
      properties:
        api_key_env:
          type: string
        base_url:
          type: string
        created_at:
          type: string
          format: date-time
        default_model:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
        health_state:
          type: string
        id:
          type: string
        kind:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_health_check_at:
          type:
          - string
          - 'null'
          format: date-time
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    AiProviderProfileListDto:
      type: object
      required:
      - generated_at
      - count
      - profiles
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AiProviderProfileDto'
    AiTaskRouteDto:
      type: object
      required:
      - task
      - primary
      - fallbacks
      - enabled
      - timeout_ms
      - max_attempts
      - concurrency
      - providers_in_reach
      - created_at
      - updated_at
      properties:
        concurrency:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        fallbacks:
          type: array
          items:
            type: string
        max_attempts:
          type: integer
          format: int32
          minimum: 0
        max_output_tokens:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        primary:
          type: string
        providers_in_reach:
          type: integer
          minimum: 0
        task:
          type: string
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    AiTaskRouteListDto:
      type: object
      required:
      - generated_at
      - count
      - routes
      properties:
        count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        routes:
          type: array
          items:
            $ref: '#/components/schemas/AiTaskRouteDto'
    ApiErrorBody:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        correlation_id:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        message:
          type: string
    ApiErrorCode:
      type: string
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - too_many_requests
      - internal
      - service_unavailable
    ApiErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorBody'
    ApiVersionInfo:
      type: object
      required:
      - api_version
      - contract_version
      - service_version
      properties:
        api_version:
          type: string
        contract_version:
          type: string
        service_version:
          type: string
    ClaimCommandRequest:
      type: object
      description: Request to claim the next command addressed to an Agent.
      required:
      - agent_id
      properties:
        agent_id:
          type: string
    ClaimCommandResponse:
      type: object
      description: Response to a command claim.
      properties:
        command:
          oneOf:
          - $ref: '#/components/schemas/AgentCommandDto'
          - type: 'null'
    CompleteCommandRequest:
      type: object
      description: Agent report of the outcome of a claimed command.
      required:
      - operation_id
      - agent_id
      - fencing_token
      - succeeded
      properties:
        agent_id:
          type: string
        error_code:
          type:
          - string
          - 'null'
        fencing_token:
          type: integer
          format: int64
          minimum: 0
        operation_id:
          type: string
        redacted_error:
          type:
          - string
          - 'null'
        result_summary:
          type:
          - string
          - 'null'
        succeeded:
          type: boolean
    CompleteCommandResponse:
      type: object
      description: Response to a command completion report.
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    CreateOperationRequest:
      type: object
      required:
      - service_instance_id
      - action
      properties:
        action:
          $ref: '#/components/schemas/OperationActionDto'
        service_instance_id:
          type: string
    CreateProviderInstanceRequest:
      type: object
      required:
      - provider_definition_id
      - display_name
      properties:
        base_url:
          type:
          - string
          - 'null'
          description: Defaults to the definition's public base URL when omitted.
        display_name:
          type: string
        provider_definition_id:
          type: string
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Defaults to the service's probe timeout when omitted.
          minimum: 0
    CreateWatchlistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        symbols:
          type: array
          items:
            type: string
    DesiredStateDto:
      type: string
      description: Canonical desired state of a service instance.
      enum:
      - RUNNING
      - STOPPED
    HealthResponse:
      type: object
      required:
      - status
      - version
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        version:
          $ref: '#/components/schemas/ApiVersionInfo'
    HealthStatus:
      type: string
      enum:
      - healthy
      - degraded
