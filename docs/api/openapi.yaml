          type: string
      responses:
        '200':
          description: Service instance state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSnapshot'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/services/{service_instance_id}/operations:
    post:
      tags:
      - Operations
      operationId: create_service_operation
      parameters:
      - name: service_instance_id
        in: path
        description: Service instance identifier
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Caller supplied idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationRequest'
        required: true
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Request does not match the target service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/system/diagnostics:
    get:
      tags:
      - System
      operationId: system_diagnostics
      responses:
        '200':
          description: Secret-redacted system diagnostics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDiagnosticsDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/system/support-bundle:
    post:
      tags:
      - System
      operationId: create_support_bundle
      responses:
        '200':
          description: Redacted diagnostic support bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleDto'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Missing required capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/version:
